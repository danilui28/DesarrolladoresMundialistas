<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Álbum Mundial Dinámico</title>

    <!-- Conectamos el CSS -->
    <link rel="stylesheet" href="jugadores.css">

    <!-- Conectamos el JS con defer para que cargue después del HTML -->
    <script src="jugadores.js" defer></script>
</head>

<body>

    <header class="encabezado-album">
        <h1>Álbum Mundial Dinámico</h1>
        <p>Proyecto dinámico usando JavaScript y Git Flow</p>

        <!-- Este contador queda preparado para que el Estudiante F lo mejore -->
        <p id="contadorAlbum" class="contador-album">
            Cromos cargados: 0
        </p>
<!-- =====================================================
     CONTADOR DEL ESTUDIANTE F
     Muestra el porcentaje de cromos desbloqueados
===================================================== -->

        <p id="contadorDesbloqueo" class="contador-desbloqueo">
            Cromos desbloqueados: 0 de 0 (0%)
        </p>
    </header>

    <nav class="menu-album">
        <a href="../index.html">Inicio</a>
        <a href="jugadores.html">Jugadores</a>
    </nav>

    <main>

        <section class="seccion-album">

            <h2>Jugadores del Mundial</h2>


            <!-- =====================================================
     HERRAMIENTAS DEL ESTUDIANTE E
     Buscador y filtro por país
===================================================== -->

            <div id="herramientasAlbum" class="herramientas-album">

                <div class="campo-filtro">
                    <label for="buscadorJugador">Buscar jugador:</label>

                    <input type="text" id="buscadorJugador" placeholder="Escribe el nombre del jugador...">
                </div>

                <div class="campo-filtro">
                    <label for="filtroPais">Filtrar por país:</label>

                    <select id="filtroPais">
                        <option value="">Todos los países</option>
                    </select>
                </div>

                <button type="button" id="btnLimpiarFiltros">
                    Limpiar filtros
                </button>

            </div>

            <p id="resultadoFiltros" class="resultado-filtros">
                Mostrando todos los cromos.
            </p>
            <div id="herramientasAlbum" class="herramientas-album">
                <!-- Aquí luego irán los filtros -->
            </div>

            <!-- =====================================================
                    SECCIÓN DEL ESTUDIANTE C
                    Aquí se mostrará el total de goles de los jugadores
                ===================================================== -->
            <section class="resumen-estudiante-c">
                <h3>Resumen Grupo A - E - C - I</h3>

                <p>
                    Total de goles acumulados de los 12 jugadores:
                    <strong id="totalGolesEstudianteC">0</strong>
                </p>
            </section>

            <!-- 
                Aquí JavaScript va a inyectar las tarjetas dinámicamente.
                Este id es MUY IMPORTANTE.
            -->
            <div id="albumJugadores" class="album-grid">
                <!-- Las tarjetas se crean desde jugadores.js -->
            </div>

        </section>

    </main>

</body>

</html>
